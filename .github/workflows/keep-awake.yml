# Keeps the Render free-plan server from falling asleep, so online rooms open straight away.
# GitHub runs this every 10 minutes and it simply asks the server for /health.
# (One always-on service fits inside Render's 750 free hours a month.)
name: keep server awake
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: curl -fsS --max-time 120 --retry 3 --retry-delay 10 https://wispbound.onrender.com/health
